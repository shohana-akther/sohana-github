<!DOCTYPE html>
<html>
<head>
    <title>Create Account</title>

    <style>
        body{
           argin:0;
           font-family: Arial, sans-serif;
           background-color:#f4f6f9;
            padding-bottom:50px;  
        }

        header{
            background-color:black;
            color:white;
            text-align:center;
            padding:25px;
        }

        .container{
            width:350px;
            margin:50px auto;
            background:white;
            padding:25px;
            border-radius:8px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        table{
            width:100%;
        }

        td{
            padding:8px 0;
        }

        input[type="email"],
        input[type="password"],
        select{
            width:100%;
            padding:8px;
            border:1px solid #ccc;
            border-radius:4px;
        }

        .btn{
            width:100%;
            padding:10px;
            background-color:green;
            color:white;
            border:none;
            border-radius:5px;
            margin-top:15px;
            cursor:pointer;
            font-size:16px;
        }

        .btn:hover{
            background-color:darkgreen;
        }

        footer{
            text-align:center;
            background:black;
            color:white;
            padding:15px;
            margin-top:40px;
        }

        .fixed-user{
            position:fixed;
            bottom:0;
            width:100%;
            background:blue;
            color:white;
            text-align:center;
            padding:5px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Techflow Solution</h1>
    </header>

    <div class="container">
        <h2>Create Account</h2>

        <form>
            <table>
                
               <tr>
               <td>Email Address</td>
               </tr>
              <tr>
             <td>
        <input type="email" value="you@example.com" readonly>
    </td>
</tr>
                
                    <td>Password</td>
                
                <tr>
                    <td><input type="password" required></td>
                </tr>

                <tr>
                    <td>Confirm Password</td>
                </tr>
                <tr>
                    <td><input type="password" required></td>
                </tr>

                <tr>
                    <td>Gender</td>
                </tr>
                <tr>
                    <td>
                        <select required>
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="others">Others</option>
                        </select>
                    </td>
                </tr>
            </table>

            <button class="btn">Register</button>
        </form>
    </div>

    <footer>
        © 2026 Techflow Solution | All Rights Reserved
    </footer>

    <div class="fixed-user">
        Current User
    </div>

</body>
</html>
